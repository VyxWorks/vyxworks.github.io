<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Opaline">
  <defs>
    <linearGradient id="opal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AD6C8"/>
      <stop offset="0.36" stop-color="#5B9DF9"/>
      <stop offset="0.68" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <!-- 좌측 세 갈래 슬릿: 원과 교차하는 부분만 투명하게 비움 -->
    <mask id="opalineSlits">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="18.6" y="0" width="2.4" height="64" fill="#000"/>
      <rect x="25.4" y="0" width="2.4" height="64" fill="#000"/>
    </mask>
  </defs>
  <circle cx="34" cy="32" r="23" fill="url(#opal)" mask="url(#opalineSlits)"/>
</svg>
