<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Opaline">
  <!-- 모노크롬 마크: 앱 아이콘과 동일 비율(실측). 라이트=먹, 다크 탭=흰. -->
  <style>
    .opaline-disk { fill: #0A0A0A; }
    @media (prefers-color-scheme: dark) { .opaline-disk { fill: #F5F6F7; } }
  </style>
  <defs>
    <!-- 좌측 세 갈래 슬릿(흰 줄 3개)을 원과 교차하는 부분만 투명하게 비움 -->
    <mask id="opalineSlits">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="10.75" y="0" width="1.75" height="64" fill="#000"/>
      <rect x="16.25" y="0" width="1.75" height="64" fill="#000"/>
      <rect x="21.75" y="0" width="1.75" height="64" fill="#000"/>
    </mask>
  </defs>
  <circle class="opaline-disk" cx="32" cy="32" r="25" mask="url(#opalineSlits)"/>
</svg>
