<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VyxWorks">
  <!-- 스튜디오 마크. 내비/푸터의 인라인 SVG 와 같은 형태지만 파비콘은 문서 밖에서
       그려지므로 currentColor 를 쓸 수 없다 — 색을 명시하고 스킴은 여기서 뒤집는다.
       (opaline-logo.svg 와 같은 패턴) -->
  <style>
    .vyx-plate { fill: #0A0A0A; }
    .vyx-mark  { stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .vyx-plate { fill: #F5F6F7; }
      .vyx-mark  { stroke: #0C0C0D; }
    }
  </style>
  <rect class="vyx-plate" width="32" height="32" rx="6"/>
  <!-- 획은 사이트 인라인 마크(3)보다 굵다. 파비콘은 16px 로 렌더되므로
       3/32 는 1.5px 가 되어 뭉갠다. 3.5 로 올려 작은 크기에서 V 가 살아남는다. -->
  <path class="vyx-mark" d="M9 9 L16 23 L23 9" fill="none"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
